<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Фото для моей страницы — Веб-мастерская</title>
  <link rel="stylesheet" href="upload.css">
  <script src="photo.js" defer></script>
  <script src="upload.js" defer></script>
</head>
<body>
  <main>
    <span class="brand">Страница «О себе»</span>

    <h1>Отправить фото</h1>
    <p>Выбери картинку. Она появится на странице, открытой на компьютере.</p>
    <form id="upload-form">
      <label for="phone-photo">Твоя картинка · JPG, PNG, WebP или GIF</label>
      <input id="phone-photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
      <img id="phone-preview" alt="Выбранная картинка" hidden>
      <button id="send-photo" type="submit" disabled>Отправить в мой проект →</button>
    </form>
    <p id="upload-message" role="status" aria-live="polite">Ссылка действует 10 минут и принимает одну картинку.</p>
    <div class="note">Оставь QR открытым на компьютере. Оба устройства должны быть в одной сети.</div>
  </main>
</body>
</html>
